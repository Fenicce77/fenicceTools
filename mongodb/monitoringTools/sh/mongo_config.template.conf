# monitoringTools connection settings. Copy to <name>_mongo_config.conf (git-ignored).
MONGOSHBINPATH=`which mongosh`
export MONGOADMINUSR="mongouser"
# Password source, first one defined wins. Never write a real password in a tracked file.
export MONGOADMINPAS_ENV="MONGO_PWD_RSNAME"
# export MONGOADMINPAS_FILE="~/.config/monitoringTools/secrets/rsname.pwd"            # chmod 600
# export MONGOADMINPAS_CMD="security find-generic-password -a rmateos -s mongo-rsname -w"  # macOS Keychain
# export MONGOADMINPAS="mongopass"                                                    # legacy plaintext (warned)
export ADMINDB="admin"
export MONGOHOST="rsName/node01,node02,node03"
