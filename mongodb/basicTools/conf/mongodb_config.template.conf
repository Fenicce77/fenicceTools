# mongo_exec.sh configuration template.
# Copy it outside the repository (or keep it under conf/, which .gitignore excludes)
# and restrict it - mongo_exec.sh refuses group/world-readable config files:
#   cp conf/mongodb_config.template.conf ~/.mongo/prod_rs.conf && chmod 600 ~/.mongo/prod_rs.conf
#
# Use single quotes for the password so '$', '`' and '\' are taken literally.

export MONGOADMINUSR='mongousername'
export MONGOADMINPAS='mongouserpassword'
export ADMINDB='admin'

# "<replica_set_name>/<host>:<port>,..." | "<host>:<port>,..." | "<mongos>:<port>"
export MONGOHOST='rs0/node01:27017,node02:27017,node03:27017'

# Optional: extra connection-string options (no leading '?').
# export MONGO_URI_OPTIONS='tls=true&appName=mongo_exec'

# Optional: client binary. Default: mongosh from PATH, legacy mongo as fallback.
# Use a legacy 4.x 'mongo' shell for servers mongosh no longer supports.
# export MONGO_CLIENT_BIN='/opt/homebrew/bin/mongosh'
