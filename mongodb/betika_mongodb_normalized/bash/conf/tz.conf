# =============================================================================
# <project_root>/conf/<instance_name>.conf  -  betika_mongodb_normalized
#
# One file per instance. The file name (without .conf) is the instance name.
# Parsed as KEY=VALUE data: it is NEVER sourced/executed, so command
# substitution (`...` / $(...)) is ignored. Recommended mode: chmod 600.
# =============================================================================

# --- Identity ------------------------------------------------------------------
# Short alias used as database prefix on the central instance (<alias>_<db>).
INSTANCE_ALIAS="tz"
# source (default) | target (the central instance; only one per conf dir)
MONGO_ROLE="source"

# --- Connection (choose one) ----------------------------------------------------
# Full connection string WITHOUT credentials (preferred; SRV supported).
MONGO_URI="mongodb://tz-mongodbcluster01-node01.betika.private:27017,tz-mongodbcluster01-node02.betika.private:27017,tz-mongodbcluster01-node03.betika.private:27017/?replicaSet=tz-mongodbcluster01"
# Or the legacy "replicaSet/host1,host2,host3" notation:
# MONGO_HOSTS="tz-mongodbcluster01/tz-mongodbcluster01-node01.betika.private,tz-mongodbcluster01-node02.betika.private"

# Defaults added when missing from the URI: authSource=admin,
# readPreference=secondaryPreferred, appName=betika_mongodb_normalized.
MONGO_USER="schema_auditor"
MONGO_AUTH_SOURCE="admin"
# MONGO_READ_PREFERENCE="secondaryPreferred"

# --- Password: first defined source wins ------------------------------------------
# 1) Name of an environment variable holding the password
# MONGO_PASSWORD_ENV="BMN_TZ_PASSWORD"
# 2) File whose first line is the password (chmod 600)
# MONGO_PASSWORD_FILE="~/.config/betika_mongodb_normalized/secrets/cd01.pwd"
# 3) Command printing the password on stdout (secret managers)
# MONGO_PASSWORD_CMD="security find-generic-password -a schema_auditor -s bmn-cd01 -w"   # macOS Keychain
# MONGO_PASSWORD_CMD="secret-tool lookup service bmn instance cd01"                       # Linux libsecret
# MONGO_PASSWORD_CMD="vault kv get -field=password secret/dbre/mongodb/cd01"              # HashiCorp Vault
# MONGO_PASSWORD_CMD="gcloud secrets versions access latest --secret=bmn-cd01"            # GCP Secret Manager
# 4) Plaintext (discouraged: a warning is emitted)
MONGO_PASSWORD="oHJeaf3wedN4obuo"

