######################## PBM Configuration ############################

## This file is a full configuration example documenting all
## options in comments.
##
## You can find the full reference for configuration options here:
## https://docs.percona.com/percona-backup-mongodb/reference/configuration-options.html


#======================Storage Configuration============================

storage:

##  Remote backup storage type. Supported types: S3, GCS, shared filesystem, Azure

#--------------------Google Cloud Storage Configuration-----------------

  type: gcs
  gcs:

## The location and name of the bucket that you have configured on the GCS
     bucket: BackupBucket

## The data directory to store backups in.
## When undefined, backups are saved at the root of the bucket.
     prefix: mongocluster/betBuilder

## The size of data chunks in bytes to be uploaded to the storage bucket in a single request.
     chunkSize: 10240000

## GCS access credentials. You can use either HMAC or Service Account keys.
## HMAC Example:
#     credentials:
#       hmacAccessKey: GOOG1E7GHK2...
#       hmacSecret: U7PCRkLy...

## Service Account Example:
     credentials:
       clientEmail: my-serviceaccount@bXXXX.com
       privateKey: "-----BEGIN PRIVATE KEY-----\nXXXXXXXXXX-----END PRIVATE KEY-----\n"
#

## Retry upload configuration options.
#      retryer:
#        backoffInitial: 1
#        backoffMax: 30
#        backoffMultiplier: 2
#
## The maximum object size that will be stored on the storage
#      maxObjSizeGB: 5018

#--------------------Filesystem Configuration---------------------------
## NOT USED by pbm-backup: PBM filesystem storage needs the same path mounted
## on every member (NFS). pbm-backup refuses it (REQUIRED_STORAGE_TYPES=GCS).
#type:
#  filesystem:

## The path to backup directory
#    path: /data/backup/pbm
#
## The maximum object size that will be stored on the storage
#      maxObjSizeGB: 5018

#====================Point-in-Time Recovery Configuration==================
## pbm-backup manages this section, do not enable it by hand:
##  - PSMDB (physical scheme): PITR must stay DISABLED (preflight fails if on).
##  - Community (logical scheme): after each logical full, pbm-backup sets
##    pitr.enabled=true, pitr.oplogSpanMin=OPLOG_INCR_MIN (default 360) and
##    pitr.compression/compressionLevel = BACKUP_COMPRESSION(_LEVEL)
##    (PITR_AUTOCONFIG=true).
## Oplog slicing node: give the PRIMARY the lowest priority.

#pitr:
#  enabled: true 

## Adjust the size of oplog chunks (in minutes).
#  oplogSpanMin: 10

## Set a compression method and level
#  compression: gzip
#  compressionLevel: 5

## Save oplog slicing without the base backup
#  oplogOnly: false

## Node priority for saving oplog slices. The highest priority node is used.
## Nodes with the same priority are randomly elected for saving oplog slices.
#  priority:
#    "mongodbcluster-node01:27017": 0.5
#    "mongodbcluster-node02:27017": 1.5
#    "mongodbcluster-node03:27017": 2.5


#==========================Backup Configuration============================

## Adjust priority of mongod nodes for making backups. The highest priority
## node is making a backup.
## Nodes with the same priority are randomly elected for a backup.
## pbm-backup elects which member LAUNCHES a backup (never the primary) but
## PBM picks the member that EXECUTES it by this priority: keep the primary
## lowest. pbm-backup warns when PBM executed a backup on another member.
backup:
#  priority:
#    "mongodbcluster-node01:27017": 0.5
#    "mongodbcluster-node02:27017": 3.0
#    "mongodbcluster-node03:27017": 1.0

## Set a compression method and level
## (pbm-backup also passes BACKUP_COMPRESSION/_LEVEL explicitly on every backup)
  compression: gzip
  compressionLevel: 5

## The wait time (in seconds) for PBM to start backups.
## This timeout controls how long PBM waits for the backup to
## transition from initial state to running status.
  timeouts:
    startingStatus: 33

## Adjust the size of oplog chunks saved within a logical backup snapshot (in minutes).
#  oplogSpanMin: 10

## Set the number of parallel collections to process during a logical backup.
## Default value is half of the number of CPU cores.
  numParallelCollections: 4

