# pbm-agent configuration template (one per replica set member).
# Replace the placeholders; keep this file readable by the pbm-agent user only.
# Each member's pbm-agent talks to its own mongod: use that member's host.
mongodb-uri: "mongodb://<pbm_user>:<pbm_password>@mongodbcluster-node01:27017/?authSource=admin&replicaSet=rsName&readConcernLevel=local&w=1"

# PITR and backup priorities are cluster settings: they belong in
# pbm-conf.yaml ("pbm config --file"), not here. See the notes there.
backup:
  dump-parallel-collections: 4

log:
  path: "/data/log/pbm/pbm.log"
  # D (debug) is very verbose; I (info) is enough for daily operation.
  level: "D"
