# /etc/systemd/system/pbm-agent.service.d/config.conf - systemd drop-in that
# makes pbm-agent read /etc/pbm-agent.yml. PBM >= 2.9 ONLY: on PBM 2.0 - 2.8
# (e.g. 2.5.0 for MongoDB 4.4) the agent does not know --config and would not
# start; remove this drop-in when downgrading.
#
#   install -D -m 0644 pbm-agent-config.conf /etc/systemd/system/pbm-agent.service.d/config.conf
#   systemctl daemon-reload && systemctl restart pbm-agent
[Service]
ExecStart=
ExecStart=/usr/bin/pbm-agent --config /etc/pbm-agent.yml
