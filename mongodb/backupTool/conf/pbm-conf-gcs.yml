# pbm-conf-gcs.yml - PBM configuration: GCP bucket with the native "gcs"
# storage type. PBM >= 2.10 ONLY (MongoDB 5.0/6.0 with PBM 2.10.0, 7.0/8.0).
# For PBM < 2.10 (MongoDB 4.2/4.4) use pbm-conf-gcp-hmac.yml.
#
# Apply once per replica set (it REPLACES the whole PBM configuration, which
# is stored in MongoDB and read by every pbm-agent):
#   install.sh --pbm-storage gcs      (copies it to /etc/pbm-storage.conf, 0600)
#   pbm config --file /etc/pbm-storage.conf
#
# Credentials: service account JSON key (INSTALL.md 1.2 B):
#   clientEmail <- jq -r .client_email key.json
#   privateKey  <- jq .private_key key.json   (already quoted, with \n escapes)
# Alternatives (replace clientEmail/privateKey):
#   - Workload Identity, PBM >= 2.13: workloadIdentity: true
#   - HMAC key in the gcs type, PBM 2.10 - 2.15 ONLY (removed in PBM 2.16):
#     hmacAccessKey / hmacSecret. On any version, an HMAC key can be used
#     with pbm-conf-gcp-hmac.yml ("type: s3") instead.
# Keys checked in the PBM 2.10.0 - 2.16.0 source (pbm/storage/gcs, pbm/config).
# The file holds the private key: keep it 0600 and delete it after applying.

storage:
  type: gcs
  gcs:
    bucket: "<bucket>"
    # One prefix per replica set, without a trailing "/".
    prefix: "<prefix, e.g. mongocluster/rs50>"
    credentials:
      clientEmail: "<service-account>@<project>.iam.gserviceaccount.com"
      privateKey: "-----BEGIN PRIVATE KEY-----\n<key>\n-----END PRIVATE KEY-----\n"
      # PBM >= 2.13, instead of clientEmail/privateKey:
      #workloadIdentity: true
      # PBM 2.10 - 2.15 only, instead of clientEmail/privateKey:
      #hmacAccessKey: "<HMAC access id>"
      #hmacSecret: "<HMAC secret>"
    # Bytes sent per upload request (optional).
    #chunkSize: 10485760

backup:
  # pbm-backup also passes --compression/--compression-level on every backup.
  compression: gzip
  compressionLevel: 5
  timeouts:
    # Seconds PBM waits for a backup to leave the "starting" state.
    startingStatus: 33
  # Collections dumped in parallel by logical backups (PBM >= 2.7).
  numParallelCollections: 4

# PITR (oplog slices) is managed by pbm-backup. "pbm config --file" replaces
# the whole configuration, PITR included:
#   - PSMDB (physical scheme): keep this section commented (PITR must be off).
#   - Community (logical scheme): pbm-backup enables PITR after the first
#     full. If you re-apply this file on a replica set already in service,
#     uncomment these lines (with your OPLOG_INCR_MIN) so that PITR stays on;
#     otherwise no oplog is saved until the next full (gap in the chain).
#pitr:
#  enabled: true
#  oplogSpanMin: 360
#  compression: gzip
#  compressionLevel: 5
